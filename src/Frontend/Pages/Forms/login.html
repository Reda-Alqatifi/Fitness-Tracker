<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="only light" id="meta-mode">
    <title>Fitness Tracker - Sign In</title>

    <link rel="icon" type="image/png" href="../../../../assets/images/FT logo.png" />

    <link rel="stylesheet" href="Form.css" />

    <!-- To use the google symbols (icons) -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined"/>
</head>
<body>

    <!-- Header -->
    <header>
        <nav id="form-nav">
            <a id="back" href="../welcome/welcome.html">
                <span class="material-symbols-outlined">arrow_back</span>
                <span>Back</span>
            </a>

            <button id="theme-switch">
                <span class="material-symbols-outlined">dark_mode</span>
                <span class="material-symbols-outlined">light_mode</span>
            </button>
        </nav>
    </header>

    <!-- Main content -->
    <main>
        <section class="card">

            <img class="logo" src="../../../../assets/images/FT logo.png" alt="FT logo"/>

            <h1>Sign In</h1>
            <p class="intro muted">Welcome back! Enter your email and password to continue.</p>

            <!-- The js is in Forms.js -->
            <form id="login-form">

                <div class="field">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required/>
                </div>

                <div class="field">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required/>
                </div>

                <label class="choice">
                    <input type="checkbox" name="remember" value="yes"/>
                    Remember me
                </label>

                <p id="message"></p>

                <button class="btn submit" type="submit">Sign In</button>

            </form>

            <p class="other-form">
                Don't have an account?
                <a href="register.html">Create now</a>
            </p>

        </section>
    </main>

    <!-- Footer -->
    <footer id="global-footer">
        <div class="rights">
            <span>Copyrights © 2026 by </span>
            <button id="members-btn">Group (1)</button>
            <span>. All Rights Reserved.</span>
        </div>

        <!-- the popup, opened when clicking on "Group (1)" (the js is in main.js) -->

                <span class="material-symbols-outlined">close</span>
            </button>
